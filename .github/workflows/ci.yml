name: CI — Push para o ECR (Aula 09)

# Roda so em tag de versao (v1.2.3) ou manualmente: as credenciais do Learner Lab
# expiram a cada sessao, entao este workflow NAO roda em todo PR/push. O fluxo
# confiavel continua sendo o script local aula-09/ecr-push.sh.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: technova-api

defaults:
  run:
    working-directory: aula-09

jobs:
  build-push:
    name: Build e push no ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # As 3 credenciais temporarias do Lab vem de GitHub Secrets
      # (o Lab nao permite OIDC nem criar roles IAM)
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Garantir repositorio ECR (idempotente)
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Build e push (sha + latest + semver)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}"
          TAGS=("sha-${GITHUB_SHA::7}" "latest")
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            TAGS+=("${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "${BASH_REMATCH[1]}")
          fi
          ARGS=()
          for t in "${TAGS[@]}"; do ARGS+=(-t "${IMAGE}:${t}"); done
          docker build "${ARGS[@]}" .
          for t in "${TAGS[@]}"; do docker push "${IMAGE}:${t}"; done
