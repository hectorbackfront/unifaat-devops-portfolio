name: CD Pipeline (Aula 10)

# lint + test -> build/push no ECR -> deploy Recreate na EC2 -> health check
on:
  push:
    branches: [main, master]
    paths:
      - 'aula-10/technova-api/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-aula10
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: technova-api
  CONTAINER_NAME: technova-api
  APP_PORT: '3000'

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-10/technova-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aula-10/technova-api/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Test (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-10/technova-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aula-10/technova-api/package-lock.json
      - run: npm ci
      - run: npm run test:ci

  build-push:
    name: Build e push (ECR)
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS (sessao do Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Garantir repositorio ECR (idempotente)
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Calcular tag (SHA do commit)
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build (multi-stage) e push sha + latest
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" aula-10/technova-api/
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy Recreate (EC2)
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      # appleboy exporta estas variaveis no shell remoto (lista em `envs`).
      - name: Deploy via SSH (login ECR -> stop -> rm -> pull -> run)
        uses: appleboy/ssh-action@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_DEFAULT_REGION,IMAGE_TAG,GIT_SHA
          script_stop: true
          script: |
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
            IMAGE="${REGISTRY}/technova-api:${IMAGE_TAG}"

            # login ANTES do pull (sem isso o pull do ECR privado falha)
            aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            # Recreate: derruba a versao antiga e sobe a nova (ha downtime)
            docker stop technova-api || true
            docker rm technova-api || true
            docker pull "$IMAGE"
            docker run -d --name technova-api --restart unless-stopped \
              -p 3000:3000 -e GIT_SHA="$GIT_SHA" "$IMAGE"
            docker ps --filter name=technova-api

      - name: Health check pos-deploy (10 tentativas)
        env:
          URL: http://${{ secrets.EC2_HOST }}:${{ env.APP_PORT }}/health
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "$URL"; then
              echo; echo "Health check OK na tentativa $i"
              exit 0
            fi
            echo "Tentativa $i/10 falhou, aguardando 6s..."
            sleep 6
          done
          echo "Health check FALHOU: o deploy nao esta saudavel" >&2
          exit 1
