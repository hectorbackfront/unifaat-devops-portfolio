name: Terraform Plan (Aula 10)

# GitOps: todo PR que mexe em .tf/.tfvars recebe o plan como comentario.
on:
  pull_request:
    branches: [main, master]
    paths:
      - 'aula-10/terraform/**.tf'
      - 'aula-10/terraform/**.tfvars'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-aula10
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}

defaults:
  run:
    working-directory: aula-10/terraform

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Credenciais temporarias do Lab (3 valores). Em producao seria OIDC + role IAM.
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      # continue-on-error: o comentario precisa sair mesmo quando o plan falha;
      # o job e reprovado no ultimo step.
      - name: terraform plan
        id: plan
        continue-on-error: true
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt; exit "${PIPESTATUS[0]}"

      - name: Detectar destroy
        id: destroy
        if: always()
        run: |
          if [ -f tfplan ] && terraform show -json tfplan | grep -q '"delete"'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comentar plan no PR
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          HAS_DESTROY: ${{ steps.destroy.outputs.found }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-aula10 -->';
            const file = 'aula-10/terraform/plan.txt';
            let plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8')
              : 'O workflow falhou antes do plan (fmt, init ou validate). Veja o log da execucao.';
            // limite de 65536 caracteres por comentario
            if (plan.length > 60000) plan = '...(truncado)...\n' + plan.slice(-60000);
            const ok = process.env.PLAN_OUTCOME === 'success';
            const warn = process.env.HAS_DESTROY === 'true'
              ? '\n> ⚠️ **Este plan DESTRUI recursos.** Revise com atencao antes de aprovar o merge.\n' : '';
            const fence = '`'.repeat(3);
            const body = [
              marker,
              `### ${ok ? '✅' : '❌'} Terraform Plan — ${ok ? 'sucesso' : 'falhou'}`,
              warn,
              '<details><summary>Ver plan</summary>',
              '',
              fence + 'terraform',
              plan,
              fence,
              '</details>',
              '',
              `*Commit ${context.sha.slice(0, 7)} · run ${context.runId}*`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Falhar o job se algo antes falhou
        if: steps.plan.outcome != 'success'
        run: exit 1
